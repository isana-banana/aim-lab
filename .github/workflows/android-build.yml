name: Build Stickman MMO

on:
  push:
    branches: [main, "prototype/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stickman MMO
        uses: actions/checkout@v4
        with:
          path: game
      - name: Use vendored AIM Core v0.5 source
        run: test -f game/aim-core/src/main/java/com/isanabanana/aim/Game.kt
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        working-directory: game
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: stickman-mmo-debug-apk
          path: game/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
