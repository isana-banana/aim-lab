name: Build AIM Lab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AIM Lab
        uses: actions/checkout@v4
        with:
          path: game

      - name: Checkout AIM adaptive viewport build
        uses: actions/checkout@v4
        with:
          repository: isana-banana/aim
          ref: 10796d641ae22d187c6d2e653b0b9db6a3e13885
          token: ${{ secrets.AIM_REPO_TOKEN }}
          path: aim-source

      - name: Generate official single-file AIM.kt
        run: |
          python3 aim-source/tools/build_single_file.py
          mkdir -p game/app/src/main/java/com/isanabanana/aim
          cp aim-source/dist/AIM.kt game/app/src/main/java/com/isanabanana/aim/AIM.kt
          test -s game/app/src/main/java/com/isanabanana/aim/AIM.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build installable APK
        working-directory: game
        env:
          AIMLAB_KEYSTORE_BASE64: ${{ secrets.AIMLAB_KEYSTORE_BASE64 }}
          AIMLAB_STORE_PASSWORD: ${{ secrets.AIMLAB_STORE_PASSWORD }}
          AIMLAB_KEY_PASSWORD: ${{ secrets.AIMLAB_KEY_PASSWORD }}
          AIMLAB_KEY_ALIAS: ${{ secrets.AIMLAB_KEY_ALIAS }}
        run: |
          if [ -n "$AIMLAB_KEYSTORE_BASE64" ] && [ -n "$AIMLAB_STORE_PASSWORD" ] && [ -n "$AIMLAB_KEY_PASSWORD" ] && [ -n "$AIMLAB_KEY_ALIAS" ]; then
            echo "$AIMLAB_KEYSTORE_BASE64" | base64 --decode > aimlab-release.p12
            export AIMLAB_KEYSTORE_PATH="$PWD/aimlab-release.p12"
            gradle --no-daemon clean :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk aim-lab-install.apk
            echo "APK_MODE=signed-release" >> "$GITHUB_ENV"
          else
            gradle --no-daemon clean :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk aim-lab-install.apk
            echo "APK_MODE=debug-unsigned-custom" >> "$GITHUB_ENV"
          fi

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: aim-lab-installable-apk
          path: game/aim-lab-install.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload generated AIM v0.5 single file
        uses: actions/upload-artifact@v4
        with:
          name: aim-lab-aim-v0.5-single-file
          path: game/app/src/main/java/com/isanabanana/aim/AIM.kt
          if-no-files-found: error
          retention-days: 14
